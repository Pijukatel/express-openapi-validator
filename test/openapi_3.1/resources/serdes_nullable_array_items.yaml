openapi: "3.1.0"
info:
  title: "Serdes with OpenAPI 3.1 array type specifier"
  version: "1"
servers:
  - url: /v1/
paths:
  /nullable_dates:
    get:
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: [array, "null"]
                items:
                  type: object
                  properties:
                    createdAt:
                      # 3.1 nullable syntax
                      type: [string, "null"]
                      format: date-time
